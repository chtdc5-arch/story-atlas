<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="《穿成禍國長公主，我把亡國劇本玩成了盛世》漫畫線上閱讀。">
  <title>穿成禍國長公主，我把亡國劇本玩成了盛世｜漫畫閱讀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="comic-reader.css?v=20260923">
</head>
<body class="reader-locked">
  <section class="access-gate" id="accessGate" aria-labelledby="accessTitle">
    <div class="gate-mark">卷</div>
    <p>PRIVATE READING ROOM</p>
    <h1 id="accessTitle">讀者通行</h1>
    <span>請輸入作者提供的共用密碼。</span>
    <form id="accessForm">
      <label for="accessPassword">共用密碼</label>
      <div class="gate-input-row">
        <input id="accessPassword" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">進入閱讀</button>
      </div>
      <small id="accessError" role="alert"></small>
    </form>
  </section>
  <div class="reading-progress" id="readingProgress"></div>
  <header class="reader-header">
    <a class="reader-brand" href="comic.html"><span>卷</span><strong>穿成禍國長公主，我把亡國劇本玩成了盛世</strong></a>
    <div class="reader-actions">
      <label for="chapterSelect">選擇話數</label>
      <select id="chapterSelect" aria-label="選擇話數"></select>
      <a id="novelReaderLink" href="read.html">小說版</a>
      <a href="index.html">創作資料庫</a>
    </div>
  </header>
  <main class="reader-shell">
    <aside class="reader-index" aria-label="漫畫話數目錄">
      <p>COMIC INDEX</p>
      <h2>漫畫目錄</h2>
      <nav id="chapterList"></nav>
    </aside>
    <article class="comic-article">
      <div class="chapter-kicker" id="chapterKicker"></div>
      <h1 id="chapterTitle"></h1>
      <p class="chapter-status" id="chapterStatus"></p>
      <div class="chapter-rule"><span></span></div>
      <div class="comic-pages" id="comicPages"></div>
      <nav class="chapter-nav" aria-label="前後話導覽">
        <button id="prevChapter">← 上一話</button>
        <button id="nextChapter">下一話 →</button>
      </nav>
    </article>
  </main>
  <script src="comic-reader.js?v=20260923"></script>
  <script src="comic-reader-auth.js?v=20260923"></script>
</body>
</html>
