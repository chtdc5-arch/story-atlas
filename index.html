<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卷宗台｜小說創作管理庫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260814-callout" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span>卷</span><div><strong>卷宗台</strong><small>STORY ATLAS</small></div></div>
      <div class="workspace-switcher"><small>目前創作項目</small><button id="workSelect">請選擇作品 <b>⌄</b></button><div id="workMenu" class="dropdown"></div></div>
      <nav id="sidebarNav" class="nav"></nav>
      <div class="sidebar-footer"><button id="settingsBtn" class="side-button">⚙ 系統設定</button><small>單人工作庫・本機保存</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="breadcrumb">創作總覽</div><div class="top-actions"><button id="syncBtn" class="quiet">雲端同步</button><button id="importBtn" class="quiet">匯入</button><button id="exportBtn" class="quiet">匯出</button><button id="resetBtn" class="quiet">清空</button><button id="primaryAction" class="primary">＋ 建立作品</button><input id="fileImport" type="file" accept="application/json" hidden /></div></header>
      <section id="app" class="content"></section>
    </main>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=20260814-callout"></script>
</body>
</html>
