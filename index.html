<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卷宗台｜小說創作管理庫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260816-uploadfix" />
  <link rel="stylesheet" href="roadmap.css?v=20260909" />
  <style>
    body.site-locked{overflow:hidden}.site-locked>.app-shell{visibility:hidden}.site-access{position:fixed;z-index:9999;inset:0;display:grid;align-content:center;justify-items:center;padding:28px;background:#f4efe5;color:#211c18;text-align:center;font-family:"Noto Serif TC",serif}.site-access:after{content:"";position:absolute;inset:26px;border:1px solid rgba(55,43,33,.17);pointer-events:none}.site-access.unlocked{animation:site-gate-out .45s ease forwards;pointer-events:none}.site-access .gate-mark{display:grid;place-items:center;width:54px;height:54px;margin-bottom:22px;background:#211c18;color:#f4efe5;font-size:24px;font-weight:900}.site-access>p{margin:0 0 12px;color:#8d2f27;font:500 11px "DM Mono",monospace;letter-spacing:.2em}.site-access h1{margin:0;font-size:clamp(38px,6vw,62px);line-height:1.2}.site-access>span{margin-top:14px;color:#766b60;font-size:14px}.site-access form{width:min(440px,100%);margin-top:34px;text-align:left}.site-access label{display:block;margin-bottom:8px;color:#766b60;font-size:12px}.site-access .gate-input-row{display:grid;grid-template-columns:1fr auto}.site-access input{min-width:0;height:48px;padding:0 15px;border:1px solid #211c18;border-right:0;background:rgba(255,255,255,.22);color:#211c18;font:16px "DM Mono",monospace;outline:none}.site-access form button{height:48px;padding:0 20px;border:1px solid #211c18;background:#211c18;color:#f4efe5;font:600 14px "Noto Serif TC",serif}.site-access small{display:block;min-height:22px;margin-top:8px;color:#8d2f27}@keyframes site-gate-out{to{opacity:0;visibility:hidden;transform:scale(1.015)}}
  </style>
</head>
<body class="site-locked">
  <section class="site-access" id="siteAccess" aria-labelledby="siteAccessTitle">
    <div class="gate-mark">卷</div><p>PRIVATE STORY ATLAS</p><h1 id="siteAccessTitle">卷宗通行</h1><span>請輸入作者提供的共用密碼。</span>
    <form id="siteAccessForm"><label for="siteAccessPassword">共用密碼</label><div class="gate-input-row"><input id="siteAccessPassword" type="password" autocomplete="current-password" required autofocus><button type="submit">進入卷宗台</button></div><small id="siteAccessError" role="alert"></small></form>
  </section>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span>卷</span><div><strong>卷宗台</strong><small>STORY ATLAS</small></div></div>
      <div class="workspace-switcher"><small>目前創作項目</small><button id="workSelect">請選擇作品 <b>⌄</b></button><div id="workMenu" class="dropdown"></div></div>
      <nav id="sidebarNav" class="nav"></nav>
      <div class="sidebar-footer"><button id="settingsBtn" class="side-button">⚙ 系統設定</button><small>單人工作庫・本機保存</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="breadcrumb">創作總覽</div><div class="top-actions"><button class="quiet" onclick="location.href='read.html'">公開閱讀</button><button id="syncBtn" class="quiet">雲端同步</button><button id="importBtn" class="quiet">匯入</button><button id="exportBtn" class="quiet">匯出</button><button id="resetBtn" class="quiet">清空</button><button id="primaryAction" class="primary">＋ 建立作品</button><input id="fileImport" type="file" accept="application/json" hidden /></div></header>
      <section id="app" class="content"></section>
    </main>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
  <script src="site-auth.js?v=20260911"></script>
</body>
</html>
